<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pencarian Rute Peta Rumania</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="lembar">

    <header class="kop">
      <p class="kop-atas">Kecerdasan Buatan &middot; Tugas 2</p>
      <h1>Pencarian Rute Peta Rumania</h1>
      <p class="kop-bawah">
        Greedy Best First Search dengan <b>f(n) = h(n)</b>
        dan A* dengan <b>f(n) = g(n) + h(n)</b>.
        Nilai h(n) memakai jarak Euclidean antar koordinat kota.
      </p>
    </header>

    <form id="form-cari" class="kendali">
      <div class="ruang">
        <label for="asal">Kota asal</label>
        <select id="asal" name="asal" required></select>
      </div>

      <button type="button" id="tukar" class="tukar" title="Tukar asal dan tujuan" aria-label="Tukar kota asal dan kota tujuan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v13m0 0-3-3m3 3 3-3M17 20V7m0 0-3 3m3-3 3 3"/></svg>
      </button>

      <div class="ruang">
        <label for="tujuan">Kota tujuan</label>
        <select id="tujuan" name="tujuan" required></select>
      </div>

      <div class="ruang">
        <label for="algoritma">Algoritma</label>
        <select id="algoritma" name="algoritma">
          <option value="astar">A*</option>
          <option value="greedy">Greedy BFS</option>
          <option value="keduanya">Bandingkan keduanya</option>
        </select>
      </div>

      <button type="submit" id="tombol-cari" class="utama">Cari rute</button>
    </form>

    <p id="pesan" class="pesan tersembunyi" role="alert"></p>

    <section class="bingkai-peta" aria-labelledby="judul-peta">
      <div class="bingkai-kop">
        <h2 id="judul-peta">Peta</h2>
        <p id="isyarat" class="isyarat">Klik kota mana pun di peta untuk memilih asal, lalu klik satu lagi untuk tujuan.</p>
      </div>

      <div class="panggung">
        <div id="peta" class="peta"></div>
        <div id="balon" class="balon tersembunyi" role="status"></div>
      </div>

      <div id="langkah" class="langkah tersembunyi">
        <div class="langkah-tombol">
          <button type="button" id="langkah-awal" title="Kembali ke awal" aria-label="Kembali ke awal">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 5 9 12l10 7z"/></svg>
          </button>
          <button type="button" id="langkah-main" class="utama-kecil" aria-label="Jalankan animasi">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>
            <span id="label-main">Putar</span>
          </button>
          <button type="button" id="langkah-maju" title="Maju satu langkah" aria-label="Maju satu langkah">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l10 7-10 7zM18 5v14"/></svg>
          </button>
        </div>
        <input type="range" id="langkah-geser" min="0" max="0" value="0" aria-label="Posisi langkah ekspansi">
        <output id="langkah-teks" class="langkah-teks"></output>
      </div>
    </section>

    <section id="hasil" class="hasil"></section>

  </main>

  <script src="app.js"></script>
</body>
</html>
